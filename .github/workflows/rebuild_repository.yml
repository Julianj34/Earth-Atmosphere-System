name: Rebuild repository structure

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type REBUILD to confirm"
        required: true
        type: string

permissions:
  contents: write

jobs:
  rebuild:
    if: ${{ github.event.inputs.confirmation == 'REBUILD' }}
    runs-on: ubuntu-latest

    env:
      REBUILD_DIR: Earth-Atmosphere-Rebuild

    steps:
      - name: Checkout complete repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check rebuild directory
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository root contents:"
          ls -la

          if [ ! -d "$REBUILD_DIR" ]; then
            echo "ERROR: Rebuild directory does not exist:"
            echo "$REBUILD_DIR"
            exit 1
          fi

          echo "Found rebuild directory: $REBUILD_DIR"

      - name: Prepare pipeline workflow
        shell: bash
        run: |
          set -euo pipefail

          TARGET_WORKFLOW="$REBUILD_DIR/.github/workflows/run_pipeline.yml"
          SOURCE_WORKFLOW=".github/workflows/run_pipeline.yml"

          if [ -f "$TARGET_WORKFLOW" ]; then
            echo "Pipeline workflow already exists inside rebuild directory."

          elif [ -f "$SOURCE_WORKFLOW" ]; then
            echo "Copying existing pipeline workflow into rebuild directory."

            mkdir -p "$REBUILD_DIR/.github/workflows"
            cp "$SOURCE_WORKFLOW" "$TARGET_WORKFLOW"

          else
            echo "ERROR: run_pipeline.yml was not found."
            echo "Checked:"
            echo "  $TARGET_WORKFLOW"
            echo "  $SOURCE_WORKFLOW"

            echo "Existing workflow files:"
            find .github/workflows \
              -maxdepth 1 \
              -type f \
              -print 2>/dev/null || true

            exit 1
          fi

      - name: Normalize rebuild structure
        shell: bash
        run: |
          set -euo pipefail

          echo "Normalizing rebuild directory names and files..."

          # Rename Notebooks to notebooks
          if [ -d "$REBUILD_DIR/Notebooks" ]; then
            if [ -e "$REBUILD_DIR/notebooks" ]; then
              echo "ERROR: Both Notebooks and notebooks exist."
              exit 1
            fi

            mv \
              "$REBUILD_DIR/Notebooks" \
              "$REBUILD_DIR/notebooks"

            echo "Renamed Notebooks -> notebooks"
          fi

          # Rename misspelled confic to config
          if [ -d "$REBUILD_DIR/confic" ]; then
            if [ -e "$REBUILD_DIR/config" ]; then
              echo "ERROR: Both confic and config exist."
              exit 1
            fi

            mv \
              "$REBUILD_DIR/confic" \
              "$REBUILD_DIR/config"

            echo "Renamed confic -> config"
          fi

          # Rename gitignore to .gitignore
          if [ -f "$REBUILD_DIR/gitignore" ]; then
            if [ -e "$REBUILD_DIR/.gitignore" ]; then
              echo "ERROR: Both gitignore and .gitignore exist."
              exit 1
            fi

            mv \
              "$REBUILD_DIR/gitignore" \
              "$REBUILD_DIR/.gitignore"

            echo "Renamed gitignore -> .gitignore"
          fi

          # Ensure all Python package marker files exist
          mkdir -p "$REBUILD_DIR/src/atmosphere/config"
          mkdir -p "$REBUILD_DIR/src/atmosphere/layers"
          mkdir -p "$REBUILD_DIR/src/atmosphere/ingest"
          mkdir -p "$REBUILD_DIR/src/atmosphere/meta"

          touch "$REBUILD_DIR/src/atmosphere/__init__.py"
          touch "$REBUILD_DIR/src/atmosphere/config/__init__.py"
          touch "$REBUILD_DIR/src/atmosphere/layers/__init__.py"
          touch "$REBUILD_DIR/src/atmosphere/ingest/__init__.py"
          touch "$REBUILD_DIR/src/atmosphere/meta/__init__.py"

          echo "Rebuild structure normalized."

      - name: Show normalized rebuild structure
        shell: bash
        run: |
          set -euo pipefail

          echo "Normalized rebuild directory contents:"

          find "$REBUILD_DIR" \
            -maxdepth 5 \
            -print \
            | sort

      - name: Validate rebuild source
        shell: bash
        run: |
          set -euo pipefail

          required_paths=(
            "$REBUILD_DIR/.github/workflows/run_pipeline.yml"
            "$REBUILD_DIR/notebooks"
            "$REBUILD_DIR/src/atmosphere"
            "$REBUILD_DIR/pipeline/run_pipeline.py"
            "$REBUILD_DIR/config/meso_feeds.yaml"
            "$REBUILD_DIR/states/current"
            "$REBUILD_DIR/states/history"
            "$REBUILD_DIR/states/registry"
            "$REBUILD_DIR/states/coupling"
            "$REBUILD_DIR/reports"
            "$REBUILD_DIR/README.md"
            "$REBUILD_DIR/LICENSE"
            "$REBUILD_DIR/.gitignore"
            "$REBUILD_DIR/pyproject.toml"
            "$REBUILD_DIR/requirements.txt"
          )

          for path in "${required_paths[@]}"; do
            if [ ! -e "$path" ]; then
              echo "ERROR: Missing required path:"
              echo "$path"
              exit 1
            fi
          done

          required_source_files=(
            "$REBUILD_DIR/src/atmosphere/__init__.py"
            "$REBUILD_DIR/src/atmosphere/paths.py"
            "$REBUILD_DIR/src/atmosphere/config/__init__.py"
            "$REBUILD_DIR/src/atmosphere/config/domain.py"
            "$REBUILD_DIR/src/atmosphere/layers/__init__.py"
            "$REBUILD_DIR/src/atmosphere/layers/layer_meso.py"
            "$REBUILD_DIR/src/atmosphere/ingest/__init__.py"
            "$REBUILD_DIR/src/atmosphere/ingest/meso_ingest.py"
            "$REBUILD_DIR/src/atmosphere/meta/__init__.py"
            "$REBUILD_DIR/src/atmosphere/meta/role_proxy_writeback.py"
            "$REBUILD_DIR/src/atmosphere/meta/holarchic_coupling_analysis.py"
          )

          for file in "${required_source_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing required source file:"
              echo "$file"
              exit 1
            fi
          done

          notebook_count="$(
            find "$REBUILD_DIR/notebooks" \
              -maxdepth 1 \
              -type f \
              -name 'atmosphere_analysis_layer*.ipynb' \
              | wc -l
          )"

          notebook_count="$(echo "$notebook_count" | tr -d ' ')"

          echo "Found $notebook_count layer notebooks."

          if [ "$notebook_count" -ne 10 ]; then
            echo "ERROR: Expected 10 layer notebooks."
            echo "Found: $notebook_count"

            echo "Detected notebooks:"
            find "$REBUILD_DIR/notebooks" \
              -maxdepth 1 \
              -type f \
              -name '*.ipynb' \
              -print \
              | sort

            exit 1
          fi

          echo "Rebuild source is valid."

      - name: Create backup tag
        shell: bash
        run: |
          set -euo pipefail

          BACKUP_TAG="legacy-before-restructure-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          git tag "$BACKUP_TAG" "$GITHUB_SHA"
          git push origin "$BACKUP_TAG"

          echo "Created backup tag:"
          echo "$BACKUP_TAG"

      - name: Create restructure branch
        shell: bash
        run: |
          set -euo pipefail

          BRANCH_NAME="restructure-v2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          git switch -c "$BRANCH_NAME"

          echo "BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_ENV"

          echo "Created local restructure branch:"
          echo "$BRANCH_NAME"

      - name: Remove old repository structure
        shell: bash
        run: |
          set -euo pipefail

          echo "Removing old repository root contents..."

          find . \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name ".git" \
            ! -name "$REBUILD_DIR" \
            -exec rm -rf {} +

          echo "Remaining root contents:"
          ls -la

          if [ ! -d "$REBUILD_DIR" ]; then
            echo "ERROR: Rebuild directory was removed unexpectedly."
            exit 1
          fi

          echo "Old repository structure removed."

      - name: Install new repository structure
        shell: bash
        run: |
          set -euo pipefail

          echo "Copying rebuild contents into repository root..."

          cp -a "$REBUILD_DIR"/. .

          echo "Removing temporary rebuild directory..."

          rm -rf "$REBUILD_DIR"

          # Empty repository-root marker
          touch .project-root

          echo "New repository structure installed."

      - name: Validate final files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            ".github/workflows/run_pipeline.yml"
            ".project-root"
            ".gitignore"
            "LICENSE"
            "README.md"
            "pyproject.toml"
            "requirements.txt"
            "pipeline/run_pipeline.py"
            "config/meso_feeds.yaml"
            "src/atmosphere/__init__.py"
            "src/atmosphere/paths.py"
            "src/atmosphere/config/__init__.py"
            "src/atmosphere/config/domain.py"
            "src/atmosphere/layers/__init__.py"
            "src/atmosphere/layers/layer_meso.py"
            "src/atmosphere/ingest/__init__.py"
            "src/atmosphere/ingest/meso_ingest.py"
            "src/atmosphere/meta/__init__.py"
            "src/atmosphere/meta/role_proxy_writeback.py"
            "src/atmosphere/meta/holarchic_coupling_analysis.py"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing required final file:"
              echo "$file"
              exit 1
            fi
          done

          echo "All required final files exist."

      - name: Validate final directories
        shell: bash
        run: |
          set -euo pipefail

          required_directories=(
            ".github/workflows"
            "notebooks"
            "src/atmosphere"
            "src/atmosphere/config"
            "src/atmosphere/layers"
            "src/atmosphere/ingest"
            "src/atmosphere/meta"
            "pipeline"
            "config"
            "states/current"
            "states/history"
            "states/registry"
            "states/registry/hypothesis_candidates"
            "states/coupling"
            "reports"
          )

          for directory in "${required_directories[@]}"; do
            if [ ! -d "$directory" ]; then
              echo "ERROR: Missing required final directory:"
              echo "$directory"
              exit 1
            fi
          done

          echo "All required final directories exist."

      - name: Validate final notebooks
        shell: bash
        run: |
          set -euo pipefail

          notebook_count="$(
            find notebooks \
              -maxdepth 1 \
              -type f \
              -name 'atmosphere_analysis_layer*.ipynb' \
              | wc -l
          )"

          notebook_count="$(echo "$notebook_count" | tr -d ' ')"

          echo "Found $notebook_count final layer notebooks."

          if [ "$notebook_count" -ne 10 ]; then
            echo "ERROR: Expected 10 layer notebooks."
            echo "Found: $notebook_count"

            find notebooks \
              -maxdepth 1 \
              -type f \
              -name '*.ipynb' \
              -print \
              | sort

            exit 1
          fi

          echo "Final notebook structure is valid."

      - name: Validate state files
        shell: bash
        run: |
          set -euo pipefail

          required_state_files=(
            "states/current/layer0_state.json"
            "states/current/layer1_state.json"
            "states/current/layer2_state.json"
            "states/current/layer2p5_meso_state.json"
            "states/current/layer3_state.json"
            "states/current/layer4_state.json"
            "states/current/layer5_state.json"
            "states/current/layer6_state.json"
            "states/current/layer7_state.json"
            "states/current/layer8_state.json"
            "states/current/layer9_state.json"
            "states/history/layer7_history.jsonl"
            "states/registry/hypothesis_registry.json"
            "states/registry/holon_registry.yaml"
            "states/coupling/holarchic_coupling_matrix.csv"
            "states/coupling/holarchic_event_card.json"
          )

          for file in "${required_state_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing required state file:"
              echo "$file"
              exit 1
            fi
          done

          echo "Required state files exist."

      - name: Show final repository structure
        shell: bash
        run: |
          set -euo pipefail

          echo "Final repository structure:"

          find . \
            -maxdepth 5 \
            -not -path "./.git/*" \
            -not -path "./.git" \
            -print \
            | sort

      - name: Commit rebuilt repository
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          # Force-add empty marker in case .gitignore ignores it
          git add -f .project-root

          if git diff --cached --quiet; then
            echo "No repository changes to commit."
            exit 0
          fi

          echo "Changes prepared for commit:"
          git status --short

          git commit \
            -m "refactor: rebuild Earth Atmosphere System structure"

          git push \
            --set-upstream \
            origin \
            "$BRANCH_NAME"

          echo "Rebuild completed successfully."
          echo "Created remote branch:"
          echo "$BRANCH_NAME"
          echo ""
          echo "Review the branch and create a pull request into main."
