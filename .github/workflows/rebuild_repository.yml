name: Rebuild repository structure

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type REBUILD to confirm"
        required: true
        type: string

permissions:
  contents: write

jobs:
  rebuild:
    if: ${{ github.event.inputs.confirmation == 'REBUILD' }}
    runs-on: ubuntu-latest

    env:
      REBUILD_DIR: Earth-Atmosphere-Rebuild

    steps:
      - name: Checkout complete repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare pipeline workflow
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "$REBUILD_DIR" ]; then
            echo "ERROR: $REBUILD_DIR directory does not exist."
            exit 1
          fi

          TARGET_WORKFLOW="$REBUILD_DIR/.github/workflows/run_pipeline.yml"
          SOURCE_WORKFLOW=".github/workflows/run_pipeline.yml"

          if [ -f "$TARGET_WORKFLOW" ]; then
            echo "Pipeline workflow already exists inside rebuild directory."

          elif [ -f "$SOURCE_WORKFLOW" ]; then
            echo "Copying existing pipeline workflow into rebuild directory."

            mkdir -p "$REBUILD_DIR/.github/workflows"
            cp "$SOURCE_WORKFLOW" "$TARGET_WORKFLOW"

          else
            echo "ERROR: run_pipeline.yml was not found."
            echo "Checked:"
            echo "  $TARGET_WORKFLOW"
            echo "  $SOURCE_WORKFLOW"

            echo "Existing workflow files:"
            find .github/workflows -maxdepth 1 -type f 2>/dev/null || true

            exit 1
          fi

      - name: Validate rebuild source
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository root contents:"
          ls -la

          echo "Rebuild directory contents:"
          find "$REBUILD_DIR" -maxdepth 4 -print | sort

          required_paths=(
            "$REBUILD_DIR/.github/workflows/run_pipeline.yml"
            "$REBUILD_DIR/notebooks"
            "$REBUILD_DIR/src/atmosphere"
            "$REBUILD_DIR/pipeline/run_pipeline.py"
            "$REBUILD_DIR/config/meso_feeds.yaml"
            "$REBUILD_DIR/README.md"
            "$REBUILD_DIR/pyproject.toml"
            "$REBUILD_DIR/requirements.txt"
          )

          for path in "${required_paths[@]}"; do
            if [ ! -e "$path" ]; then
              echo "ERROR: Missing required path: $path"
              exit 1
            fi
          done

          echo "Rebuild source is valid."

      - name: Create backup tag
        shell: bash
        run: |
          set -euo pipefail

          BACKUP_TAG="legacy-before-restructure-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          git tag "$BACKUP_TAG" "$GITHUB_SHA"
          git push origin "$BACKUP_TAG"

          echo "Created backup tag: $BACKUP_TAG"

      - name: Create restructure branch
        shell: bash
        run: |
          set -euo pipefail

          BRANCH_NAME="restructure-v2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          git switch -c "$BRANCH_NAME"

          echo "BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_ENV"

      - name: Remove old repository structure
        shell: bash
        run: |
          set -euo pipefail

          find . \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name ".git" \
            ! -name "$REBUILD_DIR" \
            -exec rm -rf {} +

          echo "Old repository structure removed."

          echo "Remaining files:"
          ls -la

      - name: Install new repository structure
        shell: bash
        run: |
          set -euo pipefail

          cp -a "$REBUILD_DIR"/. .
          rm -rf "$REBUILD_DIR"

          # Empty repository-root marker
          touch .project-root

          echo "New repository structure installed."

      - name: Validate final structure
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            ".github/workflows/run_pipeline.yml"
            ".project-root"
            "src/atmosphere/__init__.py"
            "src/atmosphere/paths.py"
            "src/atmosphere/config/__init__.py"
            "src/atmosphere/config/domain.py"
            "src/atmosphere/layers/__init__.py"
            "src/atmosphere/layers/layer_meso.py"
            "src/atmosphere/ingest/__init__.py"
            "src/atmosphere/ingest/meso_ingest.py"
            "src/atmosphere/meta/__init__.py"
            "src/atmosphere/meta/role_proxy_writeback.py"
            "src/atmosphere/meta/holarchic_coupling_analysis.py"
            "pipeline/run_pipeline.py"
            "config/meso_feeds.yaml"
            ".gitignore"
            "LICENSE"
            "README.md"
            "pyproject.toml"
            "requirements.txt"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing required file: $file"
              exit 1
            fi
          done

          required_directories=(
            "notebooks"
            "states/current"
            "states/history"
            "states/registry"
            "states/coupling"
            "reports"
          )

          for directory in "${required_directories[@]}"; do
            if [ ! -d "$directory" ]; then
              echo "ERROR: Missing directory: $directory"
              exit 1
            fi
          done

          notebook_count="$(
            find notebooks \
              -maxdepth 1 \
              -type f \
              -name 'atmosphere_analysis_layer*.ipynb' |
            wc -l
          )"

          notebook_count="$(echo "$notebook_count" | tr -d ' ')"

          echo "Found $notebook_count layer notebooks."

          if [ "$notebook_count" -ne 10 ]; then
            echo "ERROR: Expected 10 layer notebooks, found $notebook_count."

            echo "Detected notebooks:"
            find notebooks -maxdepth 1 -type f -name '*.ipynb' | sort

            exit 1
          fi

          echo "Final repository structure is valid."

      - name: Show final repository structure
        shell: bash
        run: |
          set -euo pipefail

          find . \
            -maxdepth 4 \
            -not -path "./.git/*" \
            -not -path "./.git" \
            | sort

      - name: Commit rebuilt repository
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git add -f .project-root

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m \
            "refactor: rebuild Earth Atmosphere System structure"

          git push --set-upstream origin "$BRANCH_NAME"

          echo "Created branch: $BRANCH_NAME"
